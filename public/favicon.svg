<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neon-cyan-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
    <linearGradient id="bg-dark-mesh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Carbon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-dark-mesh)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#00f2fe" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Steering Wheel Outer Ring -->
  <g filter="url(#neon-glow)">
    <circle cx="256" cy="268" r="168" fill="none" stroke="url(#neon-cyan-green)" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Central Hub Geometric Hexagon / Diamond -->
    <polygon points="256,214 304,242 304,298 256,326 208,298 208,242" fill="#090d16" stroke="url(#neon-cyan-green)" stroke-width="12"/>
    <!-- Glowing Diamond Core -->
    <polygon points="256,252 272,270 256,288 240,270" fill="url(#neon-cyan-green)"/>

    <!-- Bottom Spoke -->
    <path d="M 236 324 L 224 410 A 168 168 0 0 0 288 410 L 276 324" fill="#090d16" stroke="url(#neon-cyan-green)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Left Spoke & Arabic Calligraphy 'ج' flourish -->
    <path d="M 210 250 L 110 210 A 168 168 0 0 1 180 130 C 210 160 215 210 240 218" fill="none" stroke="url(#neon-cyan-green)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Spoke & Neon Checkmark Pass Motif (✔) -->
    <path d="M 298 270 L 398 230 A 168 168 0 0 0 350 140" fill="none" stroke="url(#neon-cyan-green)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 285 190 L 335 240 L 455 110" fill="none" stroke="#38ef7d" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Ambient Light Sparkle -->
  <polygon points="440,430 445,445 460,450 445,455 440,470 435,455 420,450 435,445" fill="#38ef7d" opacity="0.8"/>
</svg>
